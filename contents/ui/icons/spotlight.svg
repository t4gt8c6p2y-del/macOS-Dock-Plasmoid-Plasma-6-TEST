<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F0F0F3"/>
    </linearGradient>
    <filter id="soft" x="-40%" y="-40%" width="180%" height="180%"><feGaussianBlur stdDeviation="3"/></filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feGaussianBlur stdDeviation="2.5"/></filter>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#000000" stroke-opacity="0.07"/>
  <!-- barre de recherche grise -->
  <rect x="48" y="62" width="162" height="35" rx="17.5" fill="#000" opacity="0.08" filter="url(#shadow)"/>
  <rect x="48" y="59" width="162" height="35" rx="17.5" fill="#BEBEC0"/>
  <circle cx="68" cy="75.5" r="6" fill="none" stroke="#E8E8EA" stroke-width="2.4"/>
  <path d="M72.5 80 L78 85.5" stroke="#E8E8EA" stroke-width="2.6" stroke-linecap="round"/>
  <!-- halos de couleur sous les pastilles -->
  <g filter="url(#soft)" opacity="0.55">
    <rect x="56" y="117" width="35" height="35" rx="9" fill="#0A9CFF"/>
    <rect x="112" y="117" width="35" height="35" rx="9" fill="#30D158"/>
    <rect x="166" y="117" width="35" height="35" rx="9" fill="#FF2D55"/>
    <rect x="56" y="168" width="35" height="35" rx="9" fill="#FF9F0A"/>
    <rect x="112" y="168" width="35" height="35" rx="9" fill="#AF52DE"/>
  </g>
  <rect x="56" y="117" width="35" height="35" rx="9" fill="#0A9CFF"/>
  <rect x="112" y="117" width="35" height="35" rx="9" fill="#2FC24A"/>
  <rect x="166" y="117" width="35" height="35" rx="9" fill="#FF2D55"/>
  <rect x="56" y="168" width="35" height="35" rx="9" fill="#FF9500"/>
  <rect x="112" y="168" width="35" height="35" rx="9" fill="#A44DD8"/>
  <rect x="166" y="168" width="35" height="35" rx="9" fill="#8E8E93"/>
</svg>
