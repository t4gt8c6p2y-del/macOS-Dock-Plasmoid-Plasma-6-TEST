<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#EEEEF1"/>
    </linearGradient>
    <!-- Anneau : presque noir bleuté en haut, brun-gris en bas à gauche, bleu-gris en bas à droite -->
    <linearGradient id="ringV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#04141C"/>
      <stop offset="0.45" stop-color="#1B2A2E"/>
      <stop offset="1" stop-color="#5A5E66"/>
    </linearGradient>
    <linearGradient id="ringH" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7A6A62" stop-opacity="0.75"/>
      <stop offset="0.5" stop-color="#7A6A62" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#3E6286" stop-opacity="0"/>
      <stop offset="1" stop-color="#3E6286" stop-opacity="0.8"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFD84A" stop-opacity="0"/>
      <stop offset="0.3" stop-color="#F6E27A"/>
      <stop offset="0.55" stop-color="#9FE3F4"/>
      <stop offset="0.8" stop-color="#B8A6FF"/>
      <stop offset="1" stop-color="#7DB8FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FBFBFC"/>
      <stop offset="1" stop-color="#EDEDEF"/>
    </linearGradient>
    <filter id="glowblur" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="2.4"/></filter>
    <filter id="edge" x="-5%" y="-5%" width="110%" height="110%"><feGaussianBlur stdDeviation="2.2"/></filter>
    <clipPath id="disc"><circle cx="497" cy="497" r="388"/></clipPath>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%"><feGaussianBlur stdDeviation="3"/></filter>
    <!-- Coordonnées de l'anneau : repère 990 x 990 réduit à 256 -->
    <g id="holes">
      <path d="M195 505 A305 305 0 0 1 800 520 C730 550 640 545 560 510 C480 470 390 455 320 480 C270 495 230 515 195 505 Z"/>
      <path d="M280 620 C300 560 400 540 470 560 C540 580 650 615 735 615 C755 700 700 800 500 810 C360 815 270 740 280 620 Z"/>
    </g>
  </defs>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#tile)"/>
  <rect x="8.5" y="8.5" width="239" height="239" rx="55.5" fill="none" stroke="#000000" stroke-opacity="0.07"/>
  <g transform="translate(3.75 4) scale(0.25)">
    <!-- ombre douce sous l'anneau -->
    <circle cx="497" cy="505" r="385" fill="#000" opacity="0.05" filter="url(#drop)"/>
    <!-- disque sombre percé de deux ouvertures (bords adoucis) --><g filter="url(#edge)">
    <path fill-rule="evenodd" fill="url(#ringV)"
      d="M497 112 A385 385 0 1 1 496.9 112 Z
         M195 505 A305 305 0 0 1 800 520 C730 550 640 545 560 510 C480 470 390 455 320 480 C270 495 230 515 195 505 Z
         M280 620 C300 560 400 540 470 560 C540 580 650 615 735 615 C755 700 700 800 500 810 C360 815 270 740 280 620 Z"/>
    <path fill-rule="evenodd" fill="url(#ringH)"
      d="M497 112 A385 385 0 1 1 496.9 112 Z
         M195 505 A305 305 0 0 1 800 520 C730 550 640 545 560 510 C480 470 390 455 320 480 C270 495 230 515 195 505 Z
         M280 620 C300 560 400 540 470 560 C540 580 650 615 735 615 C755 700 700 800 500 810 C360 815 270 740 280 620 Z"/>
    </g>
    <!-- ouvertures claires -->
    <path fill="url(#hole)" filter="url(#edge)" d="M195 505 A305 305 0 0 1 800 520 C730 550 640 545 560 510 C480 470 390 455 320 480 C270 495 230 515 195 505 Z"/>
    <path fill="url(#hole)" filter="url(#edge)" d="M280 620 C300 560 400 540 470 560 C540 580 650 615 735 615 C755 700 700 800 500 810 C360 815 270 740 280 620 Z"/>
    <!-- lueur irisée en bas de l'anneau -->
    <g clip-path="url(#disc)"><path d="M300 840 C410 905 580 905 690 830" fill="none" stroke="url(#glow)" stroke-width="56" stroke-linecap="round" opacity="0.85" filter="url(#glowblur)"/></g>
  </g>
</svg>
